# Render Blueprint (free): the web app as a static site.
# Deploy: Render dashboard → New → Blueprint → pick this repository.
# Photos are read on the phone (in-browser OCR) and papers are stored in the phone's browser.
# For sync between devices and AI reading, see render.server.yaml.
services:
  - type: web
    name: ground
    runtime: static
    buildCommand: npm ci && npm run build:web:static
    staticPublishPath: apps/mobile/dist
    autoDeploy: true
    # App screens (/places, /document/123…) are all served by the same page.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
